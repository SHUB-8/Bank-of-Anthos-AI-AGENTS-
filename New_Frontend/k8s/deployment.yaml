apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-frontend
  labels:
    app: new-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: new-frontend
  template:
    metadata:
      labels:
        app: new-frontend
    spec:
      containers:
        - name: new-frontend
          image: new-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: new-frontend
  labels:
    app: new-frontend
spec:
  type: LoadBalancer
  selector:
    app: new-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http

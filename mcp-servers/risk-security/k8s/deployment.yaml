apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-risk-security
  labels:
    app: mcp-risk-security
    tier: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-risk-security
  template:
    metadata:
      labels:
        app: mcp-risk-security
        tier: mcp
    spec:
      containers:
        - name: mcp-risk-security
          image: mcp-risk-security:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: sse
          env:
            - name: MCP_PORT
              value: "8080"
            - name: ANOMALY_SAGE_URL
              value: "http://anomaly-sage:8085"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-risk-security
  labels:
    app: mcp-risk-security
    tier: mcp
spec:
  type: NodePort
  selector:
    app: mcp-risk-security
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31400
      protocol: TCP
      name: sse
